plugins {
    alias(libs.plugins.android.application)
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.mastersoft.fitpulse'
    compileSdk 36


    defaultConfig {
        applicationId "com.mastersoft.fitpulse"
        minSdk 33
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }


    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    implementation libs.navigation.fragment
    implementation libs.navigation.ui
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
    implementation(libs.material3.android)
    implementation libs.core.splashscreen
    implementation libs.zxing.android.embedded
    implementation libs.core
    implementation libs.zxing.android.embedded
    implementation libs.core
    implementation libs.material.v1120
    implementation libs.core.splashscreen
    implementation libs.glide
    annotationProcessor libs.glide.compiler

    implementation platform(libs.firebase.bom)
    implementation libs.firebase.analytics
    implementation libs.firebase.auth
    implementation libs.firebase.firestore
    implementation platform(libs.firebase.bom.v3310)
    implementation libs.gson

    implementation libs.payheredevs.payhere.android.sdk
    implementation libs.payheredevs.payhere.android.sdk
    implementation libs.appcompat.v160
    
    implementation libs.javamail
    implementation libs.java.activation

    implementation 'com.google.android.gms:play-services-maps:18.2.0'
    implementation 'com.google.android.gms:play-services-location:21.2.0'}